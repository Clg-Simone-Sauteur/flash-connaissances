<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - Flash connaissances</title>

  <style>
    :root {
      --ink: #1a1a2e;
      --ink2: #2d3561;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --cream: #faf8f2;
      --paper: #f2ede0;
      --border: #d8cdb4;
      --shadow: rgba(26, 26, 46, 0.12);
      --en: #1a5fa8;
      --green: #4a7c59;
      --red: #c0392b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--ink), var(--ink2));
      padding: 30px;
    }

    .carte {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--cream);
      border-radius: 24px;
      box-shadow: 0 20px 50px var(--shadow);
      overflow: hidden;
    }

    .bandeau {
      height: 12px;
      background: linear-gradient(
        90deg,
        var(--en),
        var(--gold),
        var(--gold2)
      );
    }

    .contenu {
      padding: 40px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 32px;
    }

    h2 {
      margin: 0 0 30px;
      color: var(--ink2);
      font-size: 20px;
      font-weight: normal;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      font-size: 16px;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(26, 95, 168, 0.15);
      border-color: var(--en);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .connexion {
      max-width: 520px;
      margin: 0 auto;
    }

    .champ {
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .bouton-principal {
      width: 100%;
      padding: 15px 20px;
      background: var(--en);
      color: white;
      font-size: 16px;
    }

    .bouton-principal:hover {
      background: var(--ink2);
    }

    #message {
      min-height: 24px;
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #zoneAdmin {
      display: none;
    }

    .barre-outils {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    .barre-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .compteur {
      color: var(--ink2);
      font-weight: bold;
    }

    .bouton-deconnexion {
      background: var(--ink);
      color: white;
    }

    .question-admin {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px var(--shadow);
    }

    .question-admin.inactive {
      opacity: 0.65;
    }

    .infos {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink2);
      font-size: 13px;
      font-weight: bold;
    }

    .badge-statut {
      background: #e5f0e7;
      color: var(--green);
    }

    .badge-inactif {
      background: #f7e4e1;
      color: var(--red);
    }

    .question-admin h3 {
      margin: 10px 0;
      color: var(--ink);
      font-size: 18px;
    }

    .reponse {
      margin-top: 10px;
      padding: 12px;
      background: var(--paper);
      border-radius: 10px;
    }

    .reponse strong {
      color: var(--ink2);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .bouton-modifier {
      background: var(--en);
      color: white;
    }

    .bouton-statut {
      background: var(--green);
      color: white;
    }

    .bouton-supprimer {
      background: var(--red);
      color: white;
    }

    .message-vide {
      text-align: center;
      padding: 30px;
      color: var(--ink2);
    }

    .fenetre {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.65);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }

    .fenetre.active {
      display: flex;
    }

    .fenetre-contenu {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--cream);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .fenetre-contenu h2 {
      margin-top: 0;
      margin-bottom: 25px;
    }

    .actions-fenetre {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .bouton-annuler {
      background: var(--paper);
      color: var(--ink);
      flex: 1;
    }

    .bouton-enregistrer {
      background: var(--en);
      color: white;
      flex: 1;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .contenu {
        padding: 25px 20px;
      }

      .barre-outils {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>

</head>

<body>

  <main class="carte">

```
<div class="bandeau"></div>

<div class="contenu">

  <div id="zoneConnexion" class="connexion">

    <h1>Flash connaissances</h1>
    <h2>Administration</h2>

    <form id="connexionForm">

      <div class="champ">

  <div id="zoneAdmin">

    <h1>Flash connaissances</h1>
    <h2>Administration des questions</h2>

    <div class="barre-actions">

      <div
        id="compteur"
        class="compteur"
      >
        0 question
      </div>

      <button
        id="boutonDeconnexion"
        class="bouton-deconnexion"

    </div>

      <input

        id="recherche"

      <select id="filtreClasse">

    <div id="listeQuestions"></div>

  </div>

</div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      updateDoc,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyA9qwre5oVVnkadGxnpCSAbYAuBnSBM7y4",
      authDomain: "flash-connaissances.firebaseapp.com",
      projectId: "flash-connaissances",
      storageBucket: "flash-connaissances.firebasestorage.app",
      messagingSenderId: "620283456808",
      appId: "1:620283456808:web:96bb65f597775838a5f41d"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const zoneConnexion =
      document.getElementById("zoneConnexion");

    const zoneAdmin =
      document.getElementById("zoneAdmin");

    const formulaire =
      document.getElementById("connexionForm");

    const message =
      document.getElementById("message");

    const listeQuestions =
      document.getElementById("listeQuestions");

    const recherche =
      document.getElementById("recherche");

    const filtreClasse =
      document.getElementById("filtreClasse");

    const filtreMatiere =
      document.getElementById("filtreMatiere");

    const compteur =
      document.getElementById("compteur");

    const boutonDeconnexion =
      document.getElementById("boutonDeconnexion");

    const fenetreModification =
      document.getElementById("fenetreModification");

    const formulaireModification =
      document.getElementById("formulaireModification");

    const boutonAnnuler =
      document.getElementById("boutonAnnuler");


    let questions = [];

    let questionEnModification = null;


    formulaire.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const motDePasse =
          document.getElementById("motDePasse").value;

        message.textContent =
          "Connexion en cours...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            motDePasse
          );

        } catch (erreur) {

          console.error(erreur);

          message.textContent =
            "E-mail ou mot de passe incorrect.";

        }

      }
    );


    onAuthStateChanged(auth, async (utilisateur) => {

      if (utilisateur) {

        zoneConnexion.style.display = "none";

        zoneAdmin.style.display = "block";

        await chargerQuestions();

      } else {

        zoneConnexion.style.display = "block";

        zoneAdmin.style.display = "none";

      }

    });


    async function chargerQuestions() {

      try {

        const requete = query(
          collection(db, "questions"),
          orderBy("date", "desc")
        );

        const resultat =
          await getDocs(requete);


        questions = [];


        resultat.forEach((docFirestore) => {

          questions.push({
            id: docFirestore.id,
            ...docFirestore.data()
          });

        });


        remplirFiltres();

        afficherQuestions();

      } catch (erreur) {

        console.error(erreur);

        message.textContent =
          "Impossible de charger les questions.";

      }

    }


    function remplirFiltres() {

      const classes =
        [...new Set(
          questions
            .map((question) => question.classe)
            .filter(Boolean)
        )]
        .sort();


      const matieres =
        [...new Set(
          questions
            .map((question) => question.matiere)
            .filter(Boolean)
        )]
        .sort();


      filtreClasse.innerHTML =
        '<option value="">Toutes les classes</option>';

      filtreMatiere.innerHTML =
        '<option value="">Toutes les matières</option>';


      classes.forEach((classe) => {

        const option =
          document.createElement("option");

        option.value = classe;

        option.textContent = classe;

        filtreClasse.appendChild(option);

      });


      matieres.forEach((matiere) => {

        const option =
          document.createElement("option");

        option.value = matiere;

        option.textContent = matiere;

        filtreMatiere.appendChild(option);

      });

    }


    function afficherQuestions() {

      const texteRecherche =
        recherche.value
          .trim()
          .toLowerCase();

      const classeChoisie =
        filtreClasse.value;

      const matiereChoisie =
        filtreMatiere.value;


      const questionsFiltrees =
        questions.filter((question) => {

          const texte =
            (
              question.question +
              " " +
              question.reponse +
              " " +
              question.classe +
              " " +
              question.matiere
            ).toLowerCase();


          const correspondRecherche =
            texte.includes(texteRecherche);


          const correspondClasse =
            !classeChoisie ||
            question.classe === classeChoisie;


          const correspondMatiere =
            !matiereChoisie ||
            question.matiere === matiereChoisie;


          return (
            correspondRecherche &&
            correspondClasse &&
            correspondMatiere
          );

        });


      listeQuestions.innerHTML = "";


      compteur.textContent =
        questionsFiltrees.length +
        (
          questionsFiltrees.length > 1
            ? " questions"
            : " question"
        );


      if (questionsFiltrees.length === 0) {

        listeQuestions.innerHTML =
          '<div class="message-vide">Aucune question ne correspond aux critères.</div>';

        return;

      }


      questionsFiltrees.forEach((question) => {

        const bloc =
          document.createElement("div");


        bloc.className =
          "question-admin";


        if (question.statut === "inactive") {

          bloc.classList.add("inactive");

        }


        const statut =
          question.statut === "inactive"
            ? "inactive"
            : "active";


        const boutonStatut =
          statut === "active"
            ? "DÉSACTIVER"
            : "RÉACTIVER";


        const classeStatut =
          statut === "active"
            ? "badge-statut"
            : "badge-inactif";


        bloc.innerHTML = `

          <div class="infos">

            <span class="badge">
              ${echapperHTML(question.classe)}
            </span>

            <span class="badge">
              ${echapperHTML(question.matiere)}
            </span>

            <span class="badge ${classeStatut}">
              ${statut === "active" ? "ACTIVE" : "INACTIVE"}
            </span>

          </div>


          <h3>
            ${echapperHTML(question.question)}
          </h3>


          <div class="reponse">

            <strong>Réponse :</strong>

            ${echapperHTML(question.reponse)}

          </div>


          <div class="actions">

            <button
              class="bouton-modifier"
              data-action="modifier"
              data-id="${question.id}"
            >
              MODIFIER
            </button>


            <button
              class="bouton-statut"
              data-action="statut"
              data-id="${question.id}"
            >
              ${boutonStatut}
            </button>


            <button
              class="bouton-supprimer"
              data-action="supprimer"
              data-id="${question.id}"
            >
              SUPPRIMER
            </button>

          </div>

        `;


        listeQuestions.appendChild(bloc);

      });


      listeQuestions
        .querySelectorAll("button")
        .forEach((bouton) => {

          bouton.addEventListener(
            "click",
            gererAction
          );

        });

    }


    function echapperHTML(texte) {

      return String(texte ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    async function gererAction(event) {

      const bouton =
        event.currentTarget;

      const action =
        bouton.dataset.action;

      const id =
        bouton.dataset.id;


      const question =
        questions.find(
          (element) => element.id === id
        );


      if (!question) {
        return;
      }


      if (action === "modifier") {

        ouvrirModification(question);

      }


      if (action === "statut") {

        await changerStatut(question);

      }


      if (action === "supprimer") {

        await supprimerQuestion(question);

      }

    }


    function ouvrirModification(question) {

      questionEnModification =
        question;


      document.getElementById(
        "modificationClasse"
      ).value = question.classe;


      document.getElementById(
        "modificationMatiere"
      ).value = question.matiere;


      document.getElementById(
        "modificationQuestion"
      ).value = question.question;


      document.getElementById(
        "modificationReponse"
      ).value = question.reponse;


      fenetreModification
        .classList.add("active");

    }


    boutonAnnuler.addEventListener(
      "click",
      fermerModification
    );


    function fermerModification() {

      questionEnModification = null;

      fenetreModification
        .classList.remove("active");

      formulaireModification.reset();

    }


    formulaireModification.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!questionEnModification) {
          return;
        }


        const nouvellesDonnees = {

          classe:
            document.getElementById(
              "modificationClasse"
            ).value.trim(),

          matiere:
            document.getElementById(
              "modificationMatiere"
            ).value.trim(),

          question:
            document.getElementById(
              "modificationQuestion"
            ).value.trim(),

          reponse:
            document.getElementById(
              "modificationReponse"
            ).value.trim()

        };


        try {

          await updateDoc(
            doc(
              db,
              "questions",
              questionEnModification.id
            ),
            nouvellesDonnees
          );


          const index =
            questions.findIndex(
              (question) =>
                question.id ===
                questionEnModification.id
            );


          questions[index] = {
            ...questions[index],
            ...nouvellesDonnees
          };


          remplirFiltres();

          afficherQuestions();

          fermerModification();

          alert("Question modifiée avec succès.");

        } catch (erreur) {

          console.error(erreur);

          alert(
            "Impossible de modifier la question."
          );

        }

      }
    );


    async function changerStatut(question) {

      const nouveauStatut =
        question.statut === "inactive"
          ? "active"
          : "inactive";


      try {

        await updateDoc(
          doc(
            db,
            "questions",
            question.id
          ),
          {
            statut: nouveauStatut
          }
        );


        question.statut =
          nouveauStatut;


        afficherQuestions();

      } catch (erreur) {

        console.error(erreur);

        alert(
          "Impossible de modifier le statut de la question."
        );

      }

    }


    async function supprimerQuestion(question) {

      const confirmation =
        confirm(
          "Voulez-vous vraiment supprimer cette question ?\n\n" +
          question.question
        );


      if (!confirmation) {
        return;
      }


      try {

        await deleteDoc(
          doc(
            db,
            "questions",
            question.id
          )
        );


        questions =
          questions.filter(
            (element) =>
              element.id !== question.id
          );


        remplirFiltres();

        afficherQuestions();

      } catch (erreur) {

        console.error(erreur);

        alert(
          "Impossible de supprimer la question."
        );

      }

    }


    recherche.addEventListener(
      "input",
      afficherQuestions
    );


    filtreClasse.addEventListener(
      "change",
      afficherQuestions
    );


    filtreMatiere.addEventListener(
      "change",
      afficherQuestions
    );


    boutonDeconnexion.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );

  </script>

</body>
