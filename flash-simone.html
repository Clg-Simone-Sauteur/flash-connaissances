<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flash connaissances</title>

  <style>

    :root {
      --ink: #1a1a2e;
      --ink2: #2d3561;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --cream: #faf8f2;
      --paper: #f2ede0;
      --blue: #1a5fa8;
      --blue2: #4d8fd4;
      --blue-bg: #e4eef8;
      --green: #4a7c59;
      --green2: #6aab79;
      --red: #c0392b;
      --border: #d8cdb4;
      --shadow: rgba(26, 26, 46, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111525,
          #202952
        );

      color: var(--ink);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .conteneur {
      width: 100%;
      max-width: 1100px;
      min-height: 700px;

      background: var(--cream);

      border-radius: 24px;

      box-shadow:
        0 25px 60px var(--shadow);

      padding: 45px;

      position: relative;
      overflow: hidden;
    }

    .conteneur::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 7px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--gold),
          var(--blue)
        );
    }

    .entete {
      margin-bottom: 35px;
      padding-bottom: 25px;

      border-bottom: 1px solid var(--border);
    }

    .petitTitre {
      margin: 0 0 8px 0;

      font-size: 14px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;

      color: var(--gold);
    }

    h1 {
      margin: 0;

      color: var(--blue);

      font-size: 44px;

      line-height: 1.1;
    }

    h2 {
      margin: 10px 0 0 0;

      color: var(--ink2);

      font-size: 24px;

      font-weight: normal;
    }

    .configuration {
      background: var(--paper);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 30px;
    }

    .titreSection {
      margin: 0 0 18px 0;

      font-size: 18px;
      font-weight: bold;

      color: var(--ink2);
    }

    label {
      display: block;

      margin-bottom: 10px;

      font-weight: bold;

      color: var(--ink2);
    }

    select {
      width: 100%;

      max-width: 420px;

      padding: 15px 16px;

      border: 2px solid var(--border);

      border-radius: 12px;

      background: white;

      color: var(--ink);

      font-size: 18px;

      cursor: pointer;

      outline: none;
    }

    select:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(26, 95, 168, 0.12);
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 22px;
    }

    button {
      border: none;

      border-radius: 12px;

      padding: 15px 24px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 6px 15px var(--shadow);
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 20px var(--shadow);
    }

    button:active {
      transform: translateY(0);
    }

    #lancer {
      background: var(--blue);
      color: white;
    }

    #lancer:hover {
      background: var(--blue2);
    }

    #reponse {
      background: var(--gold);
      color: var(--ink);
    }

    #reponse:hover {
      background: var(--gold2);
    }

    #suivante {
      background: var(--green);
      color: white;
    }

    #suivante:hover {
      background: var(--green2);
    }

    .zoneQuiz {
      margin-top: 30px;
    }

    /* ==========================================
       CHRONOMÈTRE
       ========================================== */

    .zoneChronometre {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom: 25px;
    }

    #chronometre {
      display: inline-block;

      min-width: 150px;

      padding: 12px 22px;

      background: var(--ink);

      color: white;

      border-radius: 14px;

      font-size: 28px;
      font-weight: bold;

      text-align: center;

      letter-spacing: 2px;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .etiquette {
      display: inline-block;

      padding: 7px 12px;

      border-radius: 20px;

      background: var(--blue-bg);

      color: var(--blue);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #matiereQuestion {
      display: inline-block;

      margin-left: 8px;

      padding: 7px 12px;

      border-radius: 20px;

      background: #f2ede0;

      color: var(--ink2);

      border: 1px solid var(--border);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #question {
      margin: 15px 0 0 0;

      padding: 40px 35px;

      min-height: 210px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        0 10px 25px var(--shadow);

      font-size: 34px;

      line-height: 1.3;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    #texteReponse {
      margin: 20px 0 0 0;

      padding: 28px;

      background: var(--blue-bg);

      border-left: 7px solid var(--blue);

      border-radius: 14px;

      font-size: 28px;

      line-height: 1.35;

      font-weight: bold;

      text-align: center;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .pied {
      margin-top: 35px;

      text-align: center;

      color: #777;

      font-size: 13px;
    }

    @media (max-width: 820px) {

      body {
        padding: 15px;
        align-items: flex-start;
      }

      .conteneur {
        min-height: auto;
        padding: 30px 25px;
        border-radius: 18px;
      }

      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 21px;
      }

      #chronometre {
        font-size: 25px;
      }

      #question {
        min-height: 180px;
        font-size: 28px;
        padding: 30px 22px;
      }

      #texteReponse {
        font-size: 24px;
      }
    }

    @media (max-width: 500px) {

      body {
        padding: 10px;
      }

      .conteneur {
        padding: 25px 18px;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 19px;
      }

      .configuration {
        padding: 20px;
      }

      select {
        max-width: none;
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      #chronometre {
        width: 100%;
        font-size: 24px;
      }

      #question {
        min-height: 160px;
        font-size: 23px;
        padding: 25px 18px;
      }

      #texteReponse {
        font-size: 21px;
        padding: 22px;
      }

      #matiereQuestion {
        margin-left: 0;
        margin-top: 8px;
      }
    }

  </style>

</head>

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /*
      ==========================================
      FIREBASE — NOUVEAU PROJET
      ==========================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDr6UgkWn-BFCEpAqi4f0AmMkoOE3qEQg",

      authDomain:
        "flash-connaissances-simone.firebaseapp.com",

      projectId:
        "flash-connaissances-simone",

      storageBucket:
        "flash-connaissances-simone.firebasestorage.app",

      messagingSenderId:
        "268185082285",

      appId:
        "1:268185082285:web:a8dbafcf0500a892206924"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    /*
      ==========================================
      ÉLÉMENTS DE LA PAGE
      ==========================================
    */

    const boutonLancer =
      document.getElementById("lancer");


    const boutonReponse =
      document.getElementById("reponse");


    const boutonSuivante =
      document.getElementById("suivante");


    const selectClasse =
      document.getElementById("classe");


    const zoneQuestion =
      document.getElementById("question");


    const zoneReponse =
      document.getElementById("texteReponse");


    const zoneMatiere =
      document.getElementById("matiereQuestion");


    const zoneChronometre =
      document.getElementById("chronometre");


    /*
      ==========================================
      VARIABLES DE SESSION
      ==========================================
    */

    let questions = [];

    let questionActuelle = null;

    let numeroQuestion = 0;

    const nombreQuestionsSession = 6;


    /*
      ==========================================
      CHRONOMÈTRE
      ==========================================
    */

    let tempsDebut = null;

    let chronometre = null;


    /*
      ==========================================
      MISE À JOUR DU CHRONOMÈTRE
      ==========================================
    */

    function mettreAJourChronometre() {

      if (!tempsDebut) {
        return;
      }

      const maintenant =
        Date.now();

      const secondesEcoulees =
        Math.floor(
          (maintenant - tempsDebut) / 1000
        );


      const minutes =
        Math.floor(
          secondesEcoulees / 60
        );


      const secondes =
        secondesEcoulees % 60;


      zoneChronometre.textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(secondes).padStart(2, "0");

    }


    /*
      ==========================================
      MELANGE ALÉATOIRE
      ==========================================
    */

    function melanger(tableau) {

      const copie =
        [...tableau];


      for (
        let i = copie.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          copie[i],
          copie[j]
        ] = [
          copie[j],
          copie[i]
        ];

      }


      return copie;

    }


    /*
      ==========================================
      DATE DE LA QUESTION
      ==========================================
    */

    function obtenirTempsDate(question) {

      if (!question.date) {
        return 0;
      }


      if (
        typeof question.date.toMillis ===
        "function"
      ) {

        return question.date.toMillis();

      }


      if (question.date.seconds) {

        return question.date.seconds * 1000;

      }


      return 0;

    }


    /*
      ==========================================
      TIRAGE PONDÉRÉ EN FAVEUR DES QUESTIONS
      LES PLUS RÉCENTES
      ==========================================

      La liste reçue est triée de la plus
      récente à la plus ancienne.

      Toutes les questions restent disponibles.

      Les plus récentes ont simplement davantage
      de chances d'être choisies.

      Exemple avec 5 questions :

        plus récente  → poids 5
        2e            → poids 4
        3e            → poids 3
        4e            → poids 2
        plus ancienne → poids 1

      Le tirage se fait sans remise.
    */

    function tirerQuestionsRecentes(
      liste,
      nombre
    ) {

      const disponibles =
        [...liste];


      const selection =
        [];


      for (
        let i = 0;
        i < nombre;
        i++
      ) {

        let poidsTotal = 0;


        for (
          let j = 0;
          j < disponibles.length;
          j++
        ) {

          poidsTotal +=
            disponibles.length - j;

        }


        let tirage =
          Math.random() * poidsTotal;


        let indexChoisi = 0;


        for (
          let j = 0;
          j < disponibles.length;
          j++
        ) {

          tirage -=
            disponibles.length - j;


          if (tirage <= 0) {

            indexChoisi = j;

            break;

          }

        }


        selection.push(
          disponibles[indexChoisi]
        );


        disponibles.splice(
          indexChoisi,
          1
        );

      }


      return selection;

    }


    /*
      ==========================================
      CONSTRUIRE LES 6 QUESTIONS DE LA SESSION
      ==========================================

      2 faciles
      2 moyennes
      2 difficiles

      Puis mélange complet des 6 questions.
    */

    function construireSession(
      toutesLesQuestions
    ) {

      const faciles =
        toutesLesQuestions.filter(
          (question) =>
            question.difficulte === "facile"
        );


      const moyennes =
        toutesLesQuestions.filter(
          (question) =>
            question.difficulte === "moyenne"
        );


      const difficiles =
        toutesLesQuestions.filter(
          (question) =>
            question.difficulte === "difficile"
        );


      /*
        Les 6 premières questions constituent
        la session équilibrée :
          2 faciles
          2 moyennes
          2 difficiles

        On vérifie le nombre TOTAL de questions
        disponibles dans chaque difficulté.
      */

      if (faciles.length < 2) {

        throw new Error(
          "Il n'y a pas assez de questions faciles pour commencer la session. ("
          + faciles.length
          + "/2 disponibles)"
        );

      }


      if (moyennes.length < 2) {

        throw new Error(
          "Il n'y a pas assez de questions de difficulté moyenne pour commencer la session. ("
          + moyennes.length
          + "/2 disponibles)"
        );

      }


      if (difficiles.length < 2) {

        throw new Error(
          "Il n'y a pas assez de questions difficiles pour commencer la session. ("
          + difficiles.length
          + "/2 disponibles)"
        );

      }


      /*
        Tirage des 6 premières questions.

        Les listes étant triées de la plus récente
        à la plus ancienne, les questions récentes
        sont favorisées sans exclure les anciennes.
      */

      const selectionFaciles =
        tirerQuestionsRecentes(
          faciles,
          2
        );


      const selectionMoyennes =
        tirerQuestionsRecentes(
          moyennes,
          2
        );


      const selectionDifficiles =
        tirerQuestionsRecentes(
          difficiles,
          2
        );


      /*
        Les 6 premières sont mélangées pour
        mélanger également les niveaux de difficulté.
      */

      let premiereSerie = melanger([
        ...selectionFaciles,
        ...selectionMoyennes,
        ...selectionDifficiles
      ]);


      /*
        On retire les 6 questions déjà utilisées.
        Les questions restantes serviront ensuite
        automatiquement à poursuivre la révision.

        Elles restent classées de la plus récente
        à la plus ancienne : l'élève continue donc
        avec des questions progressivement plus anciennes,
        jusqu'à épuisement de toute la base de la classe.
      */

      const idsDejaUtilises =
        new Set(
          premiereSerie.map(
            (question) => question.id
          )
        );


      const questionsRestantes =
        toutesLesQuestions
          .filter(
            (question) =>
              !idsDejaUtilises.has(question.id)
          )
          .sort(
            (a, b) =>
              obtenirTempsDate(b)
              -
              obtenirTempsDate(a)
          );


      /*
        La session complète contient donc :
          1. les 6 premières questions équilibrées ;
          2. toutes les autres questions actives
             de la classe, sans répétition.
      */

      return [
        ...premiereSerie,
        ...questionsRestantes
      ];

    }


    /*
      ==========================================
      DÉMARRAGE DE LA SESSION
      ==========================================
    */

    boutonLancer.addEventListener(
      "click",
      async () => {

        const classeChoisie =
          selectClasse.value;


        if (!classeChoisie) {

          zoneQuestion.textContent =
            "Veuillez choisir une classe.";

          boutonReponse.hidden = true;

          boutonSuivante.hidden = true;

          zoneReponse.hidden = true;

          zoneMatiere.hidden = true;

          return;

        }


        /*
          Réinitialisation du chronomètre.
        */

        clearInterval(
          chronometre
        );


        tempsDebut =
          Date.now();


        zoneChronometre.textContent =
          "00:00";


        chronometre =
          setInterval(
            mettreAJourChronometre,
            1000
          );


        /*
          On indique que les données sont
          en cours de chargement.
        */

        boutonLancer.disabled = true;


        zoneQuestion.textContent =
          "Chargement des questions...";


        boutonReponse.hidden = true;

        boutonSuivante.hidden = true;

        zoneReponse.hidden = true;

        zoneMatiere.hidden = true;


        try {

          /*
            Recherche de TOUTES les questions
            de la classe choisie.

            Les questions inactives seront
            ensuite retirées.
          */

          const requete =
            query(
              collection(
                db,
                "questions"
              ),
              where(
                "classe",
                "==",
                classeChoisie
              )
            );


          const resultat =
            await getDocs(
              requete
            );


          /*
            Récupération uniquement des questions
            actives.
          */

          questions =
            resultat.docs
              .map(
                (document) => ({

                  id: document.id,

                  ...document.data()

                })
              )
              .filter(
                (question) =>
                  question.statut === "active"
              );


          /*
            Tri de la plus récente à la plus
            ancienne.
          */

          questions.sort(
            (a, b) => {

              return (
                obtenirTempsDate(b)
                -
                obtenirTempsDate(a)
              );

            }
          );


          /*
            Construction de la session :
              2 faciles
              2 moyennes
              2 difficiles
            puis mélange.
          */

          questions =
            construireSession(
              questions
            );


          /*
            Première question.
          */

          numeroQuestion = 0;


          afficherQuestion();


        }

        catch (erreur) {

          console.error(
            "Erreur lors du chargement de la session :",
            erreur
          );


          clearInterval(
            chronometre
          );


          zoneQuestion.textContent =
            erreur.message ||
            "Une erreur est survenue lors du chargement des questions.";


          boutonReponse.hidden = true;

          boutonSuivante.hidden = true;

          zoneReponse.hidden = true;

          zoneMatiere.hidden = true;

        }

        finally {

          boutonLancer.disabled = false;

        }

      }
    );


    /*
      ==========================================
      AFFICHER LA QUESTION COURANTE
      ==========================================
    */

    function afficherQuestion() {

      if (
        numeroQuestion >=
        questions.length
      ) {

        terminerSession();

        return;

      }


      questionActuelle =
        questions[numeroQuestion];


      /*
        Affichage de la matière.
      */

      zoneMatiere.textContent =
        questionActuelle.matiere ||
        "";


      zoneMatiere.hidden = false;


      /*
        Affichage de la question.
      */

      zoneQuestion.textContent =
        questionActuelle.question ||
        "Question non renseignée";


      /*
        Réinitialisation de la réponse.
      */

      zoneReponse.textContent =
        "";


      zoneReponse.hidden = true;


      /*
        Bouton réponse visible.
      */

      boutonReponse.hidden = false;


      /*
        Le bouton suivant reste caché tant
        que l'élève n'a pas demandé la réponse.
      */

      boutonSuivante.hidden = true;


      /*
        Dernière question :
        le bouton indiquera "TERMINER".
      */

      if (
        numeroQuestion ===
        5
      ) {

        boutonSuivante.textContent =
          "TERMINER LA SESSION";

      }

      else {

        boutonSuivante.textContent =
          "QUESTION SUIVANTE";

      }

    }


    /*
      ==========================================
      AFFICHER LA RÉPONSE
      ==========================================
    */

    boutonReponse.addEventListener(
      "click",
      () => {

        if (!questionActuelle) {

          return;

        }


        zoneReponse.textContent =
          questionActuelle.reponse ||
          "Réponse non renseignée";


        zoneReponse.hidden = false;


        boutonReponse.hidden = true;


        boutonSuivante.hidden = false;

      }
    );


    /*
      ==========================================
      QUESTION SUIVANTE
      ==========================================
    */

    boutonSuivante.addEventListener(
      "click",
      () => {

        numeroQuestion++;


        afficherQuestion();

      }
    );


    /*
      ==========================================
      FIN DE SESSION
      ==========================================
    */

    function terminerSession() {

      clearInterval(
        chronometre
      );


      questionActuelle =
        null;


      zoneChronometre.textContent =
        "TERMINÉ";


      zoneQuestion.textContent =
        "Bravo ! Vous avez épuisé toutes les questions disponibles pour cette classe.";


      zoneMatiere.hidden = true;


      zoneReponse.hidden = true;


      boutonReponse.hidden = true;


      boutonSuivante.hidden = true;


      boutonLancer.disabled = false;

    }


  </script>

</body>

</html>
