<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flash connaissances</title>

  <style>

    :root {
      --ink: #1a1a2e;
      --ink2: #2d3561;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --cream: #faf8f2;
      --paper: #f2ede0;
      --blue: #1a5fa8;
      --blue2: #4d8fd4;
      --blue-bg: #e4eef8;
      --green: #4a7c59;
      --green2: #6aab79;
      --red: #c0392b;
      --border: #d8cdb4;
      --shadow: rgba(26, 26, 46, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111525,
          #202952
        );

      color: var(--ink);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .conteneur {
      width: 100%;
      max-width: 1100px;
      min-height: 700px;

      background: var(--cream);

      border-radius: 24px;

      box-shadow:
        0 25px 60px var(--shadow);

      padding: 45px;

      position: relative;
      overflow: hidden;
    }

    .conteneur::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 7px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--gold),
          var(--blue)
        );
    }

    .entete {
      margin-bottom: 35px;
      padding-bottom: 25px;

      border-bottom: 1px solid var(--border);
    }

    .petitTitre {
      margin: 0 0 8px 0;

      font-size: 14px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;

      color: var(--gold);
    }

    h1 {
      margin: 0;

      color: var(--blue);

      font-size: 44px;

      line-height: 1.1;
    }

    h2 {
      margin: 10px 0 0 0;

      color: var(--ink2);

      font-size: 24px;

      font-weight: normal;
    }

    .configuration {
      background: var(--paper);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 30px;
    }

    .titreSection {
      margin: 0 0 18px 0;

      font-size: 18px;
      font-weight: bold;

      color: var(--ink2);
    }

    label {
      display: block;

      margin-bottom: 10px;

      font-weight: bold;

      color: var(--ink2);
    }

    select {
      width: 100%;

      max-width: 420px;

      padding: 15px 16px;

      border: 2px solid var(--border);

      border-radius: 12px;

      background: white;

      color: var(--ink);

      font-size: 18px;

      cursor: pointer;

      outline: none;
    }

    select:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(26, 95, 168, 0.12);
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 22px;
    }

    button {
      border: none;

      border-radius: 12px;

      padding: 15px 24px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 6px 15px var(--shadow);
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 20px var(--shadow);
    }

    button:active {
      transform: translateY(0);
    }

    #lancer {
      background: var(--blue);
      color: white;
    }

    #lancer:hover {
      background: var(--blue2);
    }

    #reponse {
      background: var(--gold);
      color: var(--ink);
    }

    #reponse:hover {
      background: var(--gold2);
    }

    #suivante {
      background: var(--green);
      color: white;
    }

    #suivante:hover {
      background: var(--green2);
    }

    .zoneQuiz {
      margin-top: 30px;
    }

    /* ==========================================
       CHRONOMÈTRE
       ========================================== */

    .zoneChronometre {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom: 25px;
    }

    #chronometre {
      display: inline-block;

      min-width: 150px;

      padding: 12px 22px;

      background: var(--ink);

      color: white;

      border-radius: 14px;

      font-size: 28px;
      font-weight: bold;

      text-align: center;

      letter-spacing: 2px;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .etiquette {
      display: inline-block;

      padding: 7px 12px;

      border-radius: 20px;

      background: var(--blue-bg);

      color: var(--blue);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #matiereQuestion {
      display: inline-block;

      margin-left: 8px;

      padding: 7px 12px;

      border-radius: 20px;

      background: #f2ede0;

      color: var(--ink2);

      border: 1px solid var(--border);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #question {
      margin: 15px 0 0 0;

      padding: 40px 35px;

      min-height: 210px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        0 10px 25px var(--shadow);

      font-size: 34px;

      line-height: 1.3;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    #texteReponse {
      margin: 20px 0 0 0;

      padding: 28px;

      background: var(--blue-bg);

      border-left: 7px solid var(--blue);

      border-radius: 14px;

      font-size: 28px;

      line-height: 1.35;

      font-weight: bold;

      text-align: center;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .pied {
      margin-top: 35px;

      text-align: center;

      color: #777;

      font-size: 13px;
    }

    @media (max-width: 820px) {

      body {
        padding: 15px;
        align-items: flex-start;
      }

      .conteneur {
        min-height: auto;
        padding: 30px 25px;
        border-radius: 18px;
      }

      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 21px;
      }

      #chronometre {
        font-size: 25px;
      }

      #question {
        min-height: 180px;
        font-size: 28px;
        padding: 30px 22px;
      }

      #texteReponse {
        font-size: 24px;
      }
    }

    @media (max-width: 500px) {

      body {
        padding: 10px;
      }

      .conteneur {
        padding: 25px 18px;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 19px;
      }

      .configuration {
        padding: 20px;
      }

      select {
        max-width: none;
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      #chronometre {
        width: 100%;
        font-size: 24px;
      }

      #question {
        min-height: 160px;
        font-size: 23px;
        padding: 25px 18px;
      }

      #texteReponse {
        font-size: 21px;
        padding: 22px;
      }

      #matiereQuestion {
        margin-left: 0;
        margin-top: 8px;
      }
    }

  </style>

</head>

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      startAfter
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /*
      ==========================================
      FIREBASE — NOUVEAU PROJET
      ==========================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDr6UgkWn-BFCEpAqi4f0AmMkoOE3qEQg",

      authDomain:
        "flash-connaissances-simone.firebaseapp.com",

      projectId:
        "flash-connaissances-simone",

      storageBucket:
        "flash-connaissances-simone.firebasestorage.app",

      messagingSenderId:
        "268185082285",

      appId:
        "1:268185082285:web:a8dbafcf0500a892206924"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    /*
      ==========================================
      ÉLÉMENTS DE LA PAGE
      ==========================================
    */

    const boutonLancer =
      document.getElementById("lancer");


    const boutonReponse =
      document.getElementById("reponse");


    const boutonSuivante =
      document.getElementById("suivante");


    const selectClasse =
      document.getElementById("classe");


    const zoneQuestion =
      document.getElementById("question");


    const zoneReponse =
      document.getElementById("texteReponse");


    const zoneMatiere =
      document.getElementById("matiereQuestion");


    const zoneChronometre =
      document.getElementById("chronometre");


    /* =========================================================
       RÉVISION PAR LOTS — 2 QUESTIONS PAR MATIÈRE ET PAR TOUR
       ========================================================= */

    // Libellés identiques à ceux d'ajouter-simone.html.
    const MATIERES = [
      "Mathématiques", "Français", "Histoire, géographie et Emc",
      "Anglais", "Espagnol", "Allemand", "Physique-chimie",
      "SVT", "Technologie", "EPS", "Arts plastiques",
      "Éducation musicale", "EMI", "Latin", "Enseignement professionnel"
    ];
    const TAILLE_LOT = 30;
    const SEUIL_PRECHARGEMENT = 5;
    const boutonArreter = document.getElementById("arreter");
    const etatChargement = document.getElementById("etatChargement");

    let questions = [];
    let questionActuelle = null;
    let numeroQuestion = 0;
    let classeSession = "";
    let etatsMatieres = new Map();
    let identifiantsRecus = new Set();
    let chargementEnCours = null;
    let toutEpuise = false;
    let generationSession = 0;
    let tempsDebut = null;
    let chronometre = null;

    function mettreAJourChronometre() {
      if (!tempsDebut) return;
      const ecoulees = Math.floor((Date.now() - tempsDebut) / 1000);
      zoneChronometre.textContent =
        String(Math.floor(ecoulees / 60)).padStart(2, "0") + ":" +
        String(ecoulees % 60).padStart(2, "0");
    }

    function melanger(tableau) {
      const copie = [...tableau];
      for (let i = copie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copie[i], copie[j]] = [copie[j], copie[i]];
      }
      return copie;
    }

    function obtenirTempsDate(q) {
      if (q.date && typeof q.date.toMillis === "function") return q.date.toMillis();
      return q.date && q.date.seconds ? q.date.seconds * 1000 : 0;
    }

    // Mélange équilibré : 2 faciles, 2 moyennes et 2 difficiles dans
    // les six premières, si le contenu du lot le permet.
    // Les autres questions sont également alternées entre matières.
    function organiserLot(lot, matierePrecedente = "") {
      const reste = [...lot];
      const ordre = [];
      const quotas = { facile: 2, moyenne: 2, difficile: 2 };
      let precedente = matierePrecedente;
      while (reste.length) {
        let candidats = reste.filter(q => q.matiere !== precedente);
        if (!candidats.length) candidats = reste;
        if (ordre.length < 6) {
          const niveaux = Object.keys(quotas).filter(n => quotas[n] > 0);
          const possibles = candidats.filter(q => niveaux.includes(q.difficulte));
          if (possibles.length) candidats = possibles;
        }
        // À égalité, favoriser les matières encore les plus représentées
        // pour réduire les répétitions en fin de lot.
        const effectifs = new Map();
        for (const q of reste) effectifs.set(q.matiere, (effectifs.get(q.matiere) || 0) + 1);
        const maximum = Math.max(...candidats.map(q => effectifs.get(q.matiere)));
        candidats = candidats.filter(q => effectifs.get(q.matiere) === maximum);
        // Petit tirage aléatoire parmi les candidats pour varier les séances.
        const choix = candidats[Math.floor(Math.random() * candidats.length)];
        ordre.push(choix);
        reste.splice(reste.indexOf(choix), 1);
        if (ordre.length <= 6 && quotas[choix.difficulte] > 0) quotas[choix.difficulte]--;
        precedente = choix.matiere;
      }
      return ordre;
    }

    // Une requête Firestore ne récupère jamais plus de deux documents
    // pour une matière à un passage donné.
    async function recupererPourMatiere(matiere, nombre, generation) {
      const etat = etatsMatieres.get(matiere);
      if (!etat || etat.epuise || nombre <= 0) return [];
      const contraintes = [
        where("classe", "==", classeSession),
        where("statut", "==", "active"),
        where("matiere", "==", matiere),
        orderBy("date", "desc"),
        limit(nombre)
      ];
      if (etat.curseur) contraintes.push(startAfter(etat.curseur));
      const resultat = await getDocs(query(collection(db, "questions"), ...contraintes));
      if (generation !== generationSession) return [];
      if (resultat.docs.length) etat.curseur = resultat.docs[resultat.docs.length - 1];
      if (resultat.docs.length < nombre) etat.epuise = true;
      return resultat.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function chargerLot(generation) {
      const lot = [];
      // Deux questions par matière et par passage, puis nouveau passage
      // si moins de quinze matières disposent de questions.
      while (lot.length < TAILLE_LOT) {
        if (generation !== generationSession) return [];
        const matieresDisponibles = melanger(MATIERES.filter(m => !etatsMatieres.get(m).epuise));
        if (!matieresDisponibles.length) break;
        let nouveaux = 0;
        // Les requêtes d'un passage sont indépendantes et exécutées en parallèle.
        const demandes = [];
        let places = TAILLE_LOT - lot.length;
        for (const matiere of matieresDisponibles) {
          if (!places) break;
          const nombre = Math.min(2, places);
          demandes.push(recupererPourMatiere(matiere, nombre, generation));
          places -= nombre;
        }
        const resultats = await Promise.all(demandes);
        if (generation !== generationSession) return [];
        for (const resultat of resultats) {
          for (const question of resultat) {
            if (identifiantsRecus.has(question.id)) continue;
            identifiantsRecus.add(question.id);
            lot.push(question);
            nouveaux++;
          }
        }
        if (!nouveaux) break;
      }
      toutEpuise = MATIERES.every(m => etatsMatieres.get(m).epuise);
      const precedente = questions.length ? questions[questions.length - 1].matiere : "";
      return organiserLot(lot, precedente);
    }

    function preparerLotSuivant() {
      if (chargementEnCours || toutEpuise || !classeSession) return chargementEnCours;
      const generation = generationSession;
      etatChargement.textContent = "Préparation des prochaines questions…";
      const promesse = chargerLot(generation)
        .then(lot => {
          if (generation !== generationSession) return;
          questions.push(...lot);
          if (!lot.length) toutEpuise = true;
          etatChargement.textContent = lot.length
            ? `${questions.length} questions préparées pour cette séance.`
            : "Toutes les questions disponibles ont été chargées.";
        })
        .catch(erreur => {
          if (generation !== generationSession) return;
          console.error("Erreur de pagination Firebase :", erreur);
          etatChargement.textContent = "Chargement interrompu. Réessayez avec QUESTION SUIVANTE. " + (erreur.message || "");
          throw erreur;
        })
        .finally(() => {
          if (generation === generationSession) chargementEnCours = null;
        });
      chargementEnCours = promesse;
      return promesse;
    }

    function terminerSession(message = "Session terminée !") {
      generationSession++;
      clearInterval(chronometre);
      chronometre = null;
      tempsDebut = null;
      classeSession = "";
      chargementEnCours = null;
      questionActuelle = null;
      zoneChronometre.textContent = "TERMINÉ";
      zoneQuestion.textContent = message;
      zoneMatiere.hidden = true;
      zoneReponse.hidden = true;
      boutonReponse.hidden = true;
      boutonSuivante.hidden = true;
      boutonArreter.hidden = true;
      boutonLancer.disabled = false;
      etatChargement.textContent = "";
    }

    function afficherQuestion() {
      if (numeroQuestion >= questions.length) {
        if (toutEpuise) {
          terminerSession("Session terminée ! Toutes les questions disponibles ont été parcourues.");
        }
        return;
      }
      questionActuelle = questions[numeroQuestion];
      zoneMatiere.textContent = questionActuelle.matiere || "";
      zoneMatiere.hidden = false;
      zoneQuestion.textContent = questionActuelle.question || "Question non renseignée";
      zoneReponse.textContent = "";
      zoneReponse.hidden = true;
      boutonReponse.hidden = false;
      boutonSuivante.hidden = true;
      boutonSuivante.textContent = "QUESTION SUIVANTE";
      if (questions.length - numeroQuestion - 1 <= SEUIL_PRECHARGEMENT && !toutEpuise) {
        // Ne bloque pas la question affichée : chargement en arrière-plan.
        preparerLotSuivant()?.catch(() => {});
      }
    }

    boutonLancer.addEventListener("click", async () => {
      const classe = selectClasse.value;
      if (!classe) {
        zoneQuestion.textContent = "Veuillez choisir une classe.";
        return;
      }
      // Invalide les chargements d'une éventuelle séance précédente.
      generationSession++;
      const generation = generationSession;
      clearInterval(chronometre);
      tempsDebut = null;
      zoneChronometre.textContent = "00:00";
      questions = [];
      questionActuelle = null;
      numeroQuestion = 0;
      classeSession = classe;
      identifiantsRecus = new Set();
      etatsMatieres = new Map(MATIERES.map(m => [m, { curseur: null, epuise: false }]));
      toutEpuise = false;
      chargementEnCours = null;
      boutonLancer.disabled = true;
      boutonReponse.hidden = true;
      boutonSuivante.hidden = true;
      boutonArreter.hidden = false;
      zoneReponse.hidden = true;
      zoneMatiere.hidden = true;
      zoneQuestion.textContent = "Chargement des 30 premières questions…";
      try {
        await preparerLotSuivant();
        if (generation !== generationSession) return;
        if (!questions.length) {
          terminerSession("Aucune question active disponible pour cette classe.");
          return;
        }
        tempsDebut = Date.now();
        chronometre = setInterval(mettreAJourChronometre, 1000);
        afficherQuestion();
      } catch (erreur) {
        if (generation !== generationSession) return;
        console.error("Erreur lors du démarrage :", erreur);
        terminerSession("Impossible de charger les questions. Vérifiez les index et les règles Firebase.");
        etatChargement.textContent = erreur.message || "Erreur Firebase";
      }
    });

    boutonReponse.addEventListener("click", () => {
      if (!questionActuelle) return;
      zoneReponse.textContent = questionActuelle.reponse || "Réponse non renseignée";
      zoneReponse.hidden = false;
      boutonReponse.hidden = true;
      boutonSuivante.hidden = false;
    });

    boutonSuivante.addEventListener("click", async () => {
      if (!questionActuelle) return;
      boutonSuivante.disabled = true;
      try {
        if (numeroQuestion + 1 >= questions.length && !toutEpuise) {
          zoneQuestion.textContent = "Chargement des questions suivantes…";
          await (chargementEnCours || preparerLotSuivant());
        }
        if (!classeSession) return;
        if (numeroQuestion + 1 >= questions.length) {
          terminerSession("Session terminée ! Toutes les questions disponibles ont été parcourues.");
          return;
        }
        numeroQuestion++;
        afficherQuestion();
      } catch (erreur) {
        if (classeSession) {
          zoneQuestion.textContent = "Chargement impossible. Cliquez sur QUESTION SUIVANTE pour réessayer.";
          boutonSuivante.hidden = false;
        }
      } finally {
        boutonSuivante.disabled = false;
      }
    });

    boutonArreter.addEventListener("click", () => {
      terminerSession(`Session terminée ! ${questionActuelle ? numeroQuestion + 1 : 0} question(s) parcourue(s).`);
    });

  </script>

</body>
