<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flash connaissances</title>

  <style>

    :root {
      --ink: #1a1a2e;
      --ink2: #2d3561;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --cream: #faf8f2;
      --paper: #f2ede0;
      --blue: #1a5fa8;
      --blue2: #4d8fd4;
      --blue-bg: #e4eef8;
      --green: #4a7c59;
      --green2: #6aab79;
      --red: #c0392b;
      --border: #d8cdb4;
      --shadow: rgba(26, 26, 46, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111525,
          #202952
        );

      color: var(--ink);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .conteneur {
      width: 100%;
      max-width: 1100px;
      min-height: 700px;

      background: var(--cream);

      border-radius: 24px;

      box-shadow:
        0 25px 60px var(--shadow);

      padding: 45px;

      position: relative;
      overflow: hidden;
    }

    .conteneur::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 7px;

      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--gold),
          var(--blue)
        );
    }

    .entete {
      margin-bottom: 35px;
      padding-bottom: 25px;

      border-bottom: 1px solid var(--border);
    }

    .petitTitre {
      margin: 0 0 8px 0;

      font-size: 14px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;

      color: var(--gold);
    }

    h1 {
      margin: 0;

      color: var(--blue);

      font-size: 44px;

      line-height: 1.1;
    }

    h2 {
      margin: 10px 0 0 0;

      color: var(--ink2);

      font-size: 24px;

      font-weight: normal;
    }

    .configuration {
      background: var(--paper);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 30px;
    }

    .titreSection {
      margin: 0 0 18px 0;

      font-size: 18px;
      font-weight: bold;

      color: var(--ink2);
    }

    label {
      display: block;

      margin-bottom: 10px;

      font-weight: bold;

      color: var(--ink2);
    }

    select {
      width: 100%;

      max-width: 420px;

      padding: 15px 16px;

      border: 2px solid var(--border);

      border-radius: 12px;

      background: white;

      color: var(--ink);

      font-size: 18px;

      cursor: pointer;

      outline: none;
    }

    select:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(26, 95, 168, 0.12);
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 22px;
    }

    button {
      border: none;

      border-radius: 12px;

      padding: 15px 24px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 6px 15px var(--shadow);
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 20px var(--shadow);
    }

    button:active {
      transform: translateY(0);
    }

    #lancer {
      background: var(--blue);
      color: white;
    }

    #lancer:hover {
      background: var(--blue2);
    }

    #reponse {
      background: var(--gold);
      color: var(--ink);
    }

    #reponse:hover {
      background: var(--gold2);
    }

    #suivante {
      background: var(--green);
      color: white;
    }

    #suivante:hover {
      background: var(--green2);
    }

    .zoneQuiz {
      margin-top: 30px;
    }

    /* ==========================================
       CHRONOMÈTRE
       ========================================== */

    .zoneChronometre {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom: 25px;
    }

    #chronometre {
      display: inline-block;

      min-width: 150px;

      padding: 12px 22px;

      background: var(--ink);

      color: white;

      border-radius: 14px;

      font-size: 28px;
      font-weight: bold;

      text-align: center;

      letter-spacing: 2px;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .etiquette {
      display: inline-block;

      padding: 7px 12px;

      border-radius: 20px;

      background: var(--blue-bg);

      color: var(--blue);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #matiereQuestion {
      display: inline-block;

      margin-left: 8px;

      padding: 7px 12px;

      border-radius: 20px;

      background: #f2ede0;

      color: var(--ink2);

      border: 1px solid var(--border);

      font-size: 13px;
      font-weight: bold;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    #question {
      margin: 15px 0 0 0;

      padding: 40px 35px;

      min-height: 210px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        0 10px 25px var(--shadow);

      font-size: 34px;

      line-height: 1.3;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    #texteReponse {
      margin: 20px 0 0 0;

      padding: 28px;

      background: var(--blue-bg);

      border-left: 7px solid var(--blue);

      border-radius: 14px;

      font-size: 28px;

      line-height: 1.35;

      font-weight: bold;

      text-align: center;

      box-shadow:
        0 6px 18px var(--shadow);
    }

    .pied {
      margin-top: 35px;

      text-align: center;

      color: #777;

      font-size: 13px;
    }

    @media (max-width: 820px) {

      body {
        padding: 15px;
        align-items: flex-start;
      }

      .conteneur {
        min-height: auto;
        padding: 30px 25px;
        border-radius: 18px;
      }

      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 21px;
      }

      #chronometre {
        font-size: 25px;
      }

      #question {
        min-height: 180px;
        font-size: 28px;
        padding: 30px 22px;
      }

      #texteReponse {
        font-size: 24px;
      }
    }

    @media (max-width: 500px) {

      body {
        padding: 10px;
      }

      .conteneur {
        padding: 25px 18px;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 19px;
      }

      .configuration {
        padding: 20px;
      }

      select {
        max-width: none;
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      #chronometre {
        width: 100%;
        font-size: 24px;
      }

      #question {
        min-height: 160px;
        font-size: 23px;
        padding: 25px 18px;
      }

      #texteReponse {
        font-size: 21px;
        padding: 22px;
      }

      #matiereQuestion {
        margin-left: 0;
        margin-top: 8px;
      }
    }

  </style>

</head>

<body>

  <div class="conteneur">


<div class="entete">

  <p class="petitTitre">
    Flash connaissances
  </p>

  <h1>
    Flash connaissances
  </h1>

  <h2>
    Une question, une réflexion, une réponse.
  </h2>

</div>


<div class="configuration">

  <p class="titreSection">
    Préparer la session
  </p>

  <label for="classe">
    Choisir une classe
  </label>

  <select id="classe">

    <option value="">
      -- Choisir une classe --
    </option>

    <option value="6e A">

        </option>

        <option value="6e B">
          6e B
        </option>

        <option value="6e C">
          6e C
        </option>

        <option value="6e D">
          6e D
        </option>

        <option value="6e E">
          6e E
        </option>

        <option value="6e F">
          6e F
        </option>

        <option value="5e A">
          5e A
        </option>

        <option value="5e B">
          5e B
        </option>

        <option value="5e C">
          5e C
        </option>

        <option value="5e D">
          5e D
        </option>

        <option value="5e E">
          5e E
        </option>

        <option value="5e F">
          5e F
        </option>

        <option value="4e A">
          4e A
        </option>

        <option value="4e B">
          4e B
        </option>

        <option value="4e C">
          4e C
        </option>

        <option value="4e D">
          4e D
        </option>

        <option value="4e E">
          4e E
        </option>

        <option value="4e F">
          4e F
        </option>

        <option value="3e A">
          3e A
        </option>

        <option value="3e B">

        </option>

        <option value="3e C">
          3e C
        </option>

        <option value="3e D">

  </select>

  <div class="actions">

    <button id="lancer">

    </button>

</div>


<div class="zoneQuiz">

  <div class="zoneChronometre">

    <div id="chronometre">
      00:00
    </div>

  </div>


  <span class="etiquette">
    Question
  </span>

  <span id="matiereQuestion" hidden></span>


  <p id="question">
    Choisissez une classe puis lancez la session.
  </p>


  <div class="actions">

    <button id="reponse" hidden>
      VOIR LA RÉPONSE
    </button>

    <button id="suivante" hidden>
      QUESTION SUIVANTE
    </button>

  </div>


  <p id="texteReponse" hidden></p>

</div>


<div class="pied">
  Flash connaissances · Session de révision du collège Simone Sauteur
</div>


  </div>

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyA9qwre5oVVnkadGxnpCSAbYAuBnSBM7y4",

      authDomain:
        "flash-connaissances.firebaseapp.com",

      projectId:
        "flash-connaissances",

      storageBucket:
        "flash-connaissances.firebasestorage.app",

      messagingSenderId:
        "620283456808",

      appId:
        "1:620283456808:web:96bb65f597775838a5f41d"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    const boutonLancer =
      document.getElementById("lancer");


    const boutonReponse =
      document.getElementById("reponse");


    const boutonSuivante =
      document.getElementById("suivante");


    const selectClasse =
      document.getElementById("classe");


    const zoneQuestion =
      document.getElementById("question");


    const zoneReponse =
      document.getElementById("texteReponse");


    const zoneMatiere =
      document.getElementById("matiereQuestion");


    const zoneChronometre =
      document.getElementById("chronometre");


    let questions = [];

    let questionActuelle = null;


    /*
      VARIABLES DU CHRONOMÈTRE
    */

    let tempsDebut = null;

    let chronometre = null;


    /*
      FONCTION QUI MET À JOUR
      L'AFFICHAGE DU TEMPS
    */

    function mettreAJourChronometre() {

      if (!tempsDebut) {
        return;
      }

      const maintenant =
        Date.now();

      const secondesEcoulees =
        Math.floor(
          (maintenant - tempsDebut) / 1000
        );


      const minutes =
        Math.floor(
          secondesEcoulees / 60
        );


      const secondes =
        secondesEcoulees % 60;


      zoneChronometre.textContent =
        String(minutes).padStart(2, "0")
        + ":"
        + String(secondes).padStart(2, "0");

    }


    /*
      DÉMARRAGE DE LA SESSION
    */

    boutonLancer.addEventListener(
      "click",
      async () => {

        const classeChoisie =
          selectClasse.value;


        if (!classeChoisie) {

          zoneQuestion.textContent =
            "Veuillez choisir une classe.";

          boutonReponse.hidden = true;

          boutonSuivante.hidden = true;

          zoneReponse.hidden = true;

          zoneMatiere.hidden = true;

          return;
        }


        /*
          NOUVELLE SESSION :
          ON REPART À ZÉRO
          POUR LE CHRONOMÈTRE.
        */

        clearInterval(chronometre);

        tempsDebut =
          Date.now();

        zoneChronometre.textContent =
          "00:00";


        chronometre =
          setInterval(
            mettreAJourChronometre,
            1000
          );


        const requete =
          query(
            collection(db, "questions"),
            where(
              "classe",
              "==",
              classeChoisie
            )
          );


        try {

          const resultat =
            await getDocs(requete);


          if (resultat.empty) {

            zoneQuestion.textContent =
              "Aucune question trouvée pour cette classe.";

            boutonReponse.hidden = true;

            boutonSuivante.hidden = true;

            zoneReponse.hidden = true;

            zoneMatiere.hidden = true;

            clearInterval(chronometre);

            return;
          }


          questions =
            resultat.docs
              .map(
                (document) => ({

                  id: document.id,

                  ...document.data()

                })
              )
              .filter(
                (question) =>
                  question.statut !== "inactive"
              );


          /*
            TRI PAR DATE :

            Les questions les plus récentes
            sont placées en premier.
          */

          questions.sort(
            (a, b) => {

              const dateA =
                a.date?.toMillis
                  ? a.date.toMillis()
                  : 0;

              const dateB =
                b.date?.toMillis
                  ? b.date.toMillis()
                  : 0;

              return dateB - dateA;

            }
          );


          afficherQuestionAleatoire();

        }

        catch (erreur) {

          console.error(erreur);

          zoneQuestion.textContent =
            "Une erreur est survenue lors du chargement des questions.";

          boutonReponse.hidden = true;

          boutonSuivante.hidden = true;

          zoneReponse.hidden = true;

          zoneMatiere.hidden = true;

          clearInterval(chronometre);
        }

      }
    );


    function afficherQuestionAleatoire() {

      if (questions.length === 0) {

        zoneQuestion.textContent =
          "Toutes les questions ont été utilisées.";

        boutonReponse.hidden = true;

        boutonSuivante.hidden = true;

        zoneReponse.hidden = true;

        zoneMatiere.hidden = true;

        return;
      }


      /*
        ON PREND LES 5 QUESTIONS
        LES PLUS RÉCENTES ENCORE DISPONIBLES.
      */

      const groupeRecent =
        questions.slice(
          0,
          Math.min(5, questions.length)
        );


      /*
        TIRAGE ALÉATOIRE
        À L'INTÉRIEUR DU GROUPE DE 5.
      */

      const indexAleatoire =
        Math.floor(
          Math.random() *
          groupeRecent.length
        );


      questionActuelle =
        groupeRecent[indexAleatoire];


      /*
        ON SUPPRIME LA QUESTION
        DE LA LISTE DISPONIBLE.
      */

      questions =
        questions.filter(
          (question) =>
            question.id !== questionActuelle.id
        );


      zoneMatiere.textContent =
        questionActuelle.matiere;

      zoneMatiere.hidden = false;


      zoneQuestion.textContent =
        questionActuelle.question;


      boutonReponse.hidden = false;


      zoneReponse.hidden = true;

      zoneReponse.textContent = "";


      boutonSuivante.hidden = true;

    }


    boutonReponse.addEventListener(
      "click",
      () => {

        if (!questionActuelle) {

          return;
        }


        zoneReponse.textContent =
          questionActuelle.reponse;


        zoneReponse.hidden = false;


        boutonSuivante.hidden = false;

      }
    );


    boutonSuivante.addEventListener(
      "click",
      () => {

        afficherQuestionAleatoire();

      }
    );

  </script>

</body>

</html>
